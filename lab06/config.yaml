seed: 42
epochs: 10
device: auto
ckpt_dir: checkpoints/default
accum_steps: 1

data:
  root: ./data
  batch_size: 128
  num_workers: 4
  persistent_workers: true
  val_size: 5000
  subset: null

model:
  name: small_cnn
  num_classes: 10
  width: 32

optim:
  name: sgd
  lr: 0.05
  momentum: 0.9
  weight_decay: 5.0e-4

sched:
  name: cosine
  step_size: 4
  gamma: 0.1
  factor: 0.5
  patience: 1

mlflow:
  tracking_uri: sqlite:///mlflow.db
  experiment: lab6